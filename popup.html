<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Graylog Theme</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="head">
        <div class="brand"><span class="logo"></span><span>Graylog Theme</span></div>
        <label class="switch" title="Activer / désactiver (Alt+Maj+T)">
            <input type="checkbox" id="enabled"><span class="slider"></span>
        </label>
    </header>

    <div class="site" id="site"></div>

    <main id="main">
        <div class="actions" id="actions">
            <button type="button" class="action primary" id="openCustomizer">
                <span class="a-icon">✦</span>
                <span class="a-text"><b>Personnaliser la page</b><small>Interface, éléments, environnement… · Alt+Maj+C</small></span>
            </button>
            <div class="action-row">
                <button type="button" class="action" id="openPalette"><b>Palette</b><small>Ctrl+K</small></button>
                <button type="button" class="action" id="openPicker"><b>Masquer un élément</b><small>cliquer dans la page</small></button>
            </div>
        </div>

        <section>
            <div class="section-head">
                <h2>Thème</h2>
                <label class="mini-switch" title="Widgets en cartes, tableaux modernes, navigation épurée…">
                    <input type="checkbox" id="skin"><span>Modifier l'interface</span>
                </label>
            </div>
            <div class="grid" id="grid"></div>
        </section>
    </main>

    <footer class="foot">
        <span><kbd>Alt</kbd>+<kbd>Maj</kbd>+<kbd>T</kbd> on / off</span>
        <a href="#" id="shortcuts">Raccourcis</a>
    </footer>

    <script src="themes.js"></script>
    <script src="sites.js"></script>
    <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Graylog Theme</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="head">
        <div class="brand"><span class="logo"></span><span>Graylog Theme</span></div>
        <label class="switch" title="Activer / désactiver (Alt+Maj+T)">
            <input type="checkbox" id="enabled"><span class="slider"></span>
        </label>
    </header>

    <div class="site" id="site"></div>

    <main id="main">
        <section>
            <h2>Thème</h2>
            <div class="grid" id="grid"></div>
        </section>

        <section id="customBox" hidden>
            <div class="section-head">
                <h2>Couleurs</h2>
                <div class="inline">
                    <select id="customFrom" title="Partir d'un thème existant"></select>
                    <button type="button" class="btn sm" id="copyFrom">Copier</button>
                </div>
            </div>
            <div class="colors" id="colors"></div>
            <label class="row">
                <span>Type</span>
                <select id="customMode"><option value="dark">Sombre</option><option value="light">Clair</option></select>
            </label>
        </section>

        <section>
            <h2>Réglages</h2>
            <label class="row">
                <span>Thème actuel de Graylog <small>à régler si la détection se trompe</small></span>
                <select id="sourceMode">
                    <option value="auto">Détection auto</option>
                    <option value="dark">Sombre</option>
                    <option value="light">Clair</option>
                </select>
            </label>
            <label class="row">
                <span>Police de l'interface</span>
                <input type="text" id="fontUi" list="uiFonts" placeholder="Par défaut">
            </label>
            <label class="row">
                <span>Police du code</span>
                <input type="text" id="fontMono" list="monoFonts" placeholder="Par défaut">
            </label>
            <label class="row check">
                <span>Tableaux compacts <small>lignes moins hautes</small></span>
                <input type="checkbox" id="compact">
            </label>
            <datalist id="uiFonts">
                <option value="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
                <option value="Inter, system-ui, sans-serif">
                <option value="'IBM Plex Sans', system-ui, sans-serif">
                <option value="'Segoe UI', sans-serif">
            </datalist>
            <datalist id="monoFonts">
                <option value="'JetBrains Mono', 'Cascadia Code', Consolas, monospace">
                <option value="'Fira Code', monospace">
                <option value="Consolas, 'Courier New', monospace">
                <option value="ui-monospace, Menlo, monospace">
            </datalist>
        </section>

        <details class="section" id="cssBox">
            <summary>CSS personnalisé</summary>
            <textarea id="customCss" spellcheck="false" placeholder="/* Ex. : masquer un bandeau */&#10;.some-banner { display: none; }&#10;&#10;/* Les couleurs du thème sont disponibles : */&#10;h1 { color: var(--glt-accent); }"></textarea>
            <small class="hint">Variables : <code>--glt-bg</code>, <code>--glt-surface</code>, <code>--glt-border</code>, <code>--glt-muted</code>, <code>--glt-text</code>, <code>--glt-accent</code>, <code>--glt-info</code>, <code>--glt-success</code>, <code>--glt-warning</code>, <code>--glt-danger</code>.</small>
        </details>
    </main>

    <footer class="foot">
        <span><kbd>Alt</kbd>+<kbd>Maj</kbd>+<kbd>T</kbd> activer / désactiver</span>
        <button type="button" class="btn sm ghost" id="reset">Réinitialiser</button>
    </footer>

    <script src="themes.js"></script>
    <script src="sites.js"></script>
    <script src="popup.js"></script>
</body>
</html>
